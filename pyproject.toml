[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidetect"
version = "1.0.0"
description = "Lightweight black-box prompt-injection detection by fusing text-surface, perplexity and sentence-embedding features"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Namratha Grandhi" }]
keywords = ["prompt-injection", "llm-security", "jailbreak-detection", "perplexity", "sentence-embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
